  <text x="105" y="554" text-anchor="middle" class="box-sub">_1999/2026</text>
  <rect x="160" y="524" width="100" height="40" rx="4" fill="rgba(5,15,5,0.9)" stroke="#39b54a" stroke-width="1"/>
  <text x="210" y="540" text-anchor="middle" class="box-sub" font-weight="bold">audio_config</text>

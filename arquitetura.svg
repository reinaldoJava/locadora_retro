  <text x="550" y="36" text-anchor="middle" class="title">LOCADORA RETRO — ARQUITETURA DO SISTEMA</text>
  <line x1="60" y1="46" x2="1040" y2="46" stroke="#c8692a" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ═══════════════════════════════════════════
       COLUNA ESQUERDA: BACKEND (PYTHON / FLASK)
       ═══════════════════════════════════════════ -->

  <!-- Layer label -->
  <text x="80" y="72" class="layer-label">▶ BACKEND  (Python / Flask)</text>

  <!-- app.py -->
  <rect x="60" y="80" width="200" height="90" rx="5" fill="rgba(40,15,5,0.9)" stroke="#c8692a" stroke-width="1.5"/>
  <text x="160" y="98" text-anchor="middle" class="box-label">app.py</text>
  <text x="160" y="113" text-anchor="middle" class="box-sub">Rotas Flask + session</text>
  <text x="160" y="127" text-anchor="middle" class="box-sub">/api/iniciar-game-transition</text>
  <text x="160" y="141" text-anchor="middle" class="box-sub">/api/interagir</text>
  <text x="160" y="155" text-anchor="middle" class="box-sub">/api/animacao-concluida</text>


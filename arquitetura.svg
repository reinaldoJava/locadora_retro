<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #f5d8b0; }
      .layer-label { font-size: 13px; font-weight: bold; fill: #e8a060; letter-spacing: 0.1em; }
      .box-label { font-size: 12px; font-weight: bold; fill: #f5d8b0; }
      .box-sub { font-size: 10px; fill: #c8a96e; }
      .arrow-label { font-size: 10px; fill: #8ab8d8; }
      .protocol-label { font-size: 10px; fill: #70c870; }
      .section-title { font-size: 11px; font-weight: bold; fill: #5ab8ff; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a9de0" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#39b54a" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c8692a" />
    </marker>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a02;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="url(#bg-grad)" rx="8"/>
  <rect width="1100" height="820" fill="none" stroke="#c8692a" stroke-width="2" rx="8"/>


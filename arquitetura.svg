  <line x1="160" y1="490" x2="160" y2="524" stroke="#39b54a" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ═══════════════════════════════════════════
       COLUNA CENTRAL: HTTP / HTMX
       ═══════════════════════════════════════════ -->

  <text x="420" y="72" class="layer-label">▶ TRANSPORTE  (HTTP + HTMX)</text>

  <!-- HTTP box -->
  <rect x="360" y="80" width="200" height="136" rx="5" fill="rgba(2,8,25,0.9)" stroke="#4a9de0" stroke-width="1.5"/>
  <text x="460" y="100" text-anchor="middle" class="box-label">Requisições HTMX</text>
  <line x1="375" y1="107" x2="545" y2="107" stroke="#4a9de0" stroke-width="0.5"/>
  <text x="380" y="122" class="box-sub">hx-post="/api/interagir"</text>
  <text x="380" y="137" class="box-sub">hx-target="#ui-jogo"</text>
  <text x="380" y="152" class="box-sub">hx-swap="innerHTML"</text>
  <text x="380" y="167" class="box-sub">hx-trigger="load"</text>
  <text x="380" y="182" class="box-sub">HX-Redirect → /jogo</text>
  <text x="380" y="197" class="box-sub">HX-Trigger → ui_commands</text>

  <!-- HX-Trigger protocol box -->
  <rect x="360" y="238" width="200" height="110" rx="5" fill="rgba(5,15,5,0.9)" stroke="#39b54a" stroke-width="1.5"/>
  <text x="460" y="258" text-anchor="middle" class="box-label">HX-Trigger Protocol</text>
  <line x1="375" y1="265" x2="545" y2="265" stroke="#39b54a" stroke-width="0.5"/>
  <text x="380" y="280" class="protocol-label">{ "ui_commands": [</text>
  <text x="390" y="294" class="protocol-label">{ "action": "typeText",</text>
  <text x="390" y="308" class="protocol-label">  "args": { elementId,</text>
  <text x="390" y="322" class="protocol-label">    fullText, speed } },</text>
  <text x="380" y="336" class="protocol-label">{ "action": "playAudio", ... }]}</text>

  <!-- Session box -->
  <rect x="360" y="370" width="200" height="80" rx="5" fill="rgba(40,15,5,0.9)" stroke="#c8692a" stroke-width="1.5"/>
  <text x="460" y="390" text-anchor="middle" class="box-label">Flask Session</text>
  <line x1="375" y1="397" x2="545" y2="397" stroke="#c8692a" stroke-width="0.5"/>
  <text x="380" y="412" class="box-sub">Serializa DiretorNarrativo</text>
  <text x="380" y="427" class="box-sub">Recria por requisição</text>
  <text x="380" y="441" class="box-sub">Cookie signed (SECRET_KEY)</text>


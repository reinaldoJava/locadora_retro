  <text x="160" y="218" text-anchor="middle" class="box-label">DiretorNarrativo</text>
  <text x="160" y="234" text-anchor="middle" class="box-sub">Orchestrator principal</text>
  <text x="160" y="248" text-anchor="middle" class="box-sub">Herda todos os Mixins</text>
  <line x1="160" y1="170" x2="160" y2="196" stroke="#4a9de0" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="165" y="185" class="arrow-label">instancia</text>


  <text x="107" y="310" text-anchor="middle" class="box-sub" font-weight="bold">Renderer</text>
  <text x="107" y="324" text-anchor="middle" class="box-sub">Mixin</text>
  <text x="107" y="337" text-anchor="middle" class="box-sub">→ HTML</text>

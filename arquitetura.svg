  <rect x="167" y="292" width="93" height="54" rx="4" fill="rgba(20,8,2,0.95)" stroke="#c8692a" stroke-width="1"/>
  <text x="213" y="310" text-anchor="middle" class="box-sub" font-weight="bold">Cinematic</text>
  <text x="213" y="324" text-anchor="middle" class="box-sub">Mixin</text>
  <text x="213" y="337" text-anchor="middle" class="box-sub">→ 1999→2026</text>
  <!-- PrologoMixin -->
  <rect x="60" y="354" width="93" height="54" rx="4" fill="rgba(20,8,2,0.95)" stroke="#c8692a" stroke-width="1"/>
  <text x="107" y="372" text-anchor="middle" class="box-sub" font-weight="bold">Prologo</text>
  <text x="107" y="386" text-anchor="middle" class="box-sub">Mixin</text>
  <text x="107" y="399" text-anchor="middle" class="box-sub">→ slides 2026</text>
  <!-- IntroMixin -->
  <rect x="167" y="354" width="93" height="54" rx="4" fill="rgba(20,8,2,0.95)" stroke="#c8692a" stroke-width="1"/>
  <text x="213" y="372" text-anchor="middle" class="box-sub" font-weight="bold">Intro</text>
  <text x="213" y="386" text-anchor="middle" class="box-sub">Mixin</text>
  <text x="213" y="399" text-anchor="middle" class="box-sub">→ slides login</text>

  <!-- Connector from DiretorNarrativo to mixins -->
  <line x1="160" y1="256" x2="160" y2="292" stroke="#c8692a" stroke-width="1" stroke-dasharray="3,3"/>


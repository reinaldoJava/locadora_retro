  <rect x="60" y="430" width="200" height="60" rx="5" fill="rgba(2,8,25,0.95)" stroke="#4a9de0" stroke-width="1.5"/>
  <text x="160" y="452" text-anchor="middle" class="box-label">engine.py</text>
  <text x="160" y="467" text-anchor="middle" class="box-sub">Estado da partida</text>
  <text x="160" y="481" text-anchor="middle" class="box-sub">processar_escolha() · formatar_para_frontend()</text>
  <line x1="160" y1="408" x2="160" y2="430" stroke="#4a9de0" stroke-width="1.5" marker-end="url(#arrowhead)"/>


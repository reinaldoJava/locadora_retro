version: '3.8'

# Ambiente controlado pela variável LLM_PROVIDER:
#   LLM_PROVIDER=ollama  (padrão) → Ollama local, sem custo, requer Docker
#   LLM_PROVIDER=gemini           → Gemini 1.5 Flash via API (GCP / produção)
#
# Para rodar localmente:
#   docker-compose up -d
#   python app.py
#
# Para rodar em produção (GCP ou qualquer ambiente externo):
#   export LLM_PROVIDER=gemini
#   export GEMINI_API_KEY="sua_chave_aqui"
#   python app.py
#
# Chave Gemini em: https://aistudio.google.com/app/apikey

services:

  # Servidor Ollama — usado apenas quando LLM_PROVIDER=ollama (default local)
  ollama:
    image: ollama/ollama:latest
    container_name: locadora_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0:11434

  # Instalador do modelo — roda uma vez e desliga
  ollama-init:
    image: ollama/ollama:latest
    container_name: locadora_ollama_init
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command: -c "sleep 6 && echo 'Baixando modelo qwen2.5:7b-instruct...' && ollama pull qwen2.5:7b-instruct && echo 'Modelo pronto!'"
    restart: "no"

volumes:
  
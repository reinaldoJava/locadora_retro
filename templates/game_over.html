<div id="game-over-screen" style="
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: rgba(0, 0, 0, 0.9); color: #e74c3c;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-family: monospace; text-align: center;
">
    {{ game_over_text | safe }}
    <button style="
        margin-top: 30px; padding: 15px 30px; font-size: 1.2rem;
        background: #c0392b; color: white; border: none; border-radius: 5px;
        cursor: pointer; transition: background 0.3s ease;
    " onclick="window.location.href='/'">RECONECTAR SISTEMA</button>
</div>

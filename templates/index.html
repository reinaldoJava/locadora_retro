<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motor 1999/2026 - O Jogo</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
<script type="module" src="/static/js/motor_shell.js"></script>

<div id="start-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <p class="texto-sistema">SISTEMA CARREGADO<span class="loading-dots"></span></p>
    <button id="btn-start-game" style="margin-top: 50px; padding: 10px 20px; font-size: 16px; cursor: pointer; background: #222; color: #00ff00; border: 1px solid #00ff00;">ESTABELECER CONEXÃO</button>
</div>

<!-- Áudio fora do #ui-jogo para sobreviver aos swaps de innerHTML -->
<audio id="trilha-sonora-1999" src="/static/audio/Game_1999.mp3" loop preload="auto"></audio>
<audio id="trilha-sonora-2026" loop preload="none"></audio>

<div class="game-container tema-{{ tema_visual }}" id="ui-jogo">
    {% if initial_gameplay_content %}
    {{ initial_gameplay_content | safe }}
    {% endif %}
</div>
</body>
</html>

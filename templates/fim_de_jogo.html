<div id="end-game-screen" style="
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background-color: rgba(0, 0, 0, 0.9); color: #00ff00;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-family: monospace; text-align: center;
">
    {{ fim_de_jogo_text | safe }}
    <button style="
        margin-top: 30px; padding: 15px 30px; font-size: 1.2rem;
        background: #008000; color: white; border: none; border-radius: 5px;
        cursor: pointer; transition: background 0.3s ease;
    " onclick="window.location.reload()">JOGAR NOVAMENTE</button>
</div>

# ─────────────────────────────────────────────────────────────
# Locadora Retrô — Cloud Build CI/CD
# Dispara: push na branch main (configure no console do Cloud Build)
# Pré-requisito (executar uma vez no terminal):
#   gcloud artifacts repositories create locadora-retro \
#     --repository-format=docker --location=us-central1
#   gcloud projects add-iam-policy-binding PROJECT_ID \
#     --member="serviceAccount:sa-cloudbuild@PROJECT_ID.iam.gserviceaccount.com" \
#     --role="roles/artifactregistry.writer"
# ─────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _SERVICE: locadora-retro
  _LLM_MODEL: gemini-3.1-flash-lite

steps:
  # ── 1. Build da imagem Docker ──────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/locadora-retro/$_SERVICE:$SHORT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/locadora-retro/$_SERVICE:latest
      - .

  # ── 2. Push para o Artifact Registry ──────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/locadora-retro/$_SERVICE

  # ── 3. Deploy no Cloud Run ─────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/locadora-retro/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      - --memory=512Mi
      - --cpu=1
      - --timeout=300
      - --concurrency=80
      - --set-env-vars=LLM_PROVIDER=gemini,LLM_MODEL=$_LLM_MODEL
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,SECRET_KEY=flask-secret-key:latest
      - --service-account=sa-cloudrun@$PROJECT_ID.iam.gserviceaccount.com

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/locadora-retro/$_SERVICE:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

# ─────────────────────────────────────────────────────────────
# Locadora Retrô — Cloud Build CI/CD
# Dispara: push na branch main (configure no console do Cloud Build)
# URL gerada automaticamente: https://locadora-retro-****-uc.a.run.app
# ─────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _SERVICE: locadora-retro
  _LLM_MODEL: gemini-2.0-flash-lite

steps:
  # ── 1. Build da imagem Docker ──────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/$_SERVICE:$SHORT_SHA
      - -t
      - gcr.io/$PROJECT_ID/$_SERVICE:latest
      - .

  # ── 2. Push para o Container Registry ─────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: [build]
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/$_SERVICE

  # ── 3. Deploy no Cloud Run ─────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    waitFor: [push]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=gcr.io/$PROJECT_ID/$_SERVICE:$SHORT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated          # URL pública sem autenticação
      - --min-instances=0               # Scale-to-zero (grátis quando inativo)
      - --max-instances=3               # Limite de escala (controla custo)
      - --memory=512Mi                  # Suficiente para Flask + in-memory pool
      - --cpu=1
      - --timeout=300                   # 5 min por request (SSE Gemini demora ~3s)
      - --concurrency=80                # Requests simultâneos por instância
      - --set-env-vars=LLM_PROVIDER=gemini,LLM_MODEL=$_LLM_MODEL
      # Segredos criados via: gcloud secrets create gemini-api-key --data-file=-
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,SECRET_KEY=flask-secret-key:latest

images:
  - gcr.io/$PROJECT_ID/$_SERVICE

options:
  logging: CLOUD_LOGGING_ONLY
